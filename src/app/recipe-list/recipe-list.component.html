<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 p-4">
    <div *ngFor="let recipe of recipes" class="bg-white rounded shadow p-2">
      <img [src]="recipe.strMealThumb" alt="{{ recipe.strMeal }}" class="w-full h-48 object-cover rounded">
      <h2 class="text-center font-semibold mt-2">{{ recipe.strMeal }}</h2>
    </div>
  </div>
